<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate New Ciphertext</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .result { background: #f5f5f5; padding: 15px; border-radius: 5px; margin: 10px 0; }
        .success { border-left: 4px solid #28a745; }
        .error { border-left: 4px solid #dc3545; }
        textarea { width: 100%; height: 150px; margin: 10px 0; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Generate New Ciphertext for contact.js</h1>

        <h2>Step 1: Enter your contact data (JSON format)</h2>
        <textarea id="contactData" placeholder='[
    {
        "Name": "John Doe",
        "Email": "john@example.com",
        "Cell Phone": "555-123-4567"
    },
    {
        "Name": "Jane Smith",
        "Email": "jane@example.com",
        "Cell Phone": "555-987-6543"
    }
]'>[
    {
        "Name": "John Doe",
        "Email": "john@example.com",
        "Cell Phone": "555-123-4567"
    },
    {
        "Name": "Jane Smith",
        "Email": "jane@example.com",
        "Cell Phone": "555-987-6543"
    }
]</textarea>

        <h2>Step 2: Enter your password</h2>
        <input type="password" id="password" value="your_secure_password" style="width: 100%; padding: 10px; margin: 10px 0;">

        <h2>Step 3: Generate ciphertext</h2>
        <button onclick="generateNewCiphertext()">Generate Ciphertext</button>

        <div id="results"></div>
    </div>

    <script>
        function generateCiphertext(data, password) {
            try {
                const jsonString = JSON.stringify(data);
                const ciphertext = CryptoJS.AES.encrypt(jsonString, password);
                return ciphertext.toString();
            } catch (error) {
                throw new Error('Failed to generate ciphertext: ' + error.message);
            }
        }

        function testDecryption(ciphertext, password) {
            try {
                const bytes = CryptoJS.AES.decrypt(ciphertext, password);
                const decryptedData = JSON.parse(bytes.toString(CryptoJS.enc.Utf8));
                return decryptedData;
            } catch (error) {
                throw new Error('Decryption test failed: ' + error.message);
            }
        }

        let currentPassword = '';

        function generateNewCiphertext() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '';

            try {
                // Get user input
                const contactDataText = document.getElementById('contactData').value;
                const password = document.getElementById('password').value;
                currentPassword = password; // Store for toggle function

                if (!password.trim()) {
                    resultsDiv.innerHTML = '<div class="result error">Please enter a password.</div>';
                    return;
                }

                // Parse JSON data
                const contactData = JSON.parse(contactDataText);

                // Generate ciphertext
                const newCiphertext = generateCiphertext(contactData, password);

                // Test decryption
                const decryptedTest = testDecryption(newCiphertext, password);

                // Display results
                resultsDiv.innerHTML = `
                    <div class="result success">
                        <h3>✅ Ciphertext Generated Successfully!</h3>
                        <p><strong>New ciphertext:</strong></p>
                        <textarea style="width: 100%; height: 100px;">${newCiphertext}</textarea>
                        <p><strong>Password:</strong> <span id="passwordDisplay">••••••••••••••••</span>
                        <button onclick="togglePassword()" style="margin-left: 10px; padding: 2px 8px; font-size: 12px;">Show</button></p>

                        <h4>🔧 To update your contact.js file:</h4>
                        <p>Replace the ciphertext variable with this new value:</p>
                        <code>const ciphertext = "${newCiphertext}";</code>

                        <h4>✅ Decryption Test Passed:</h4>
                        <pre>${JSON.stringify(decryptedTest, null, 2)}</pre>
                    </div>
                `;

            } catch (error) {
                resultsDiv.innerHTML = `<div class="result error">❌ Error: ${error.message}</div>`;
            }
        }

        function togglePassword() {
            const passwordDisplay = document.getElementById('passwordDisplay');
            const button = event.target;

            if (button.textContent === 'Show') {
                passwordDisplay.textContent = currentPassword;
                button.textContent = 'Hide';
            } else {
                passwordDisplay.textContent = '••••••••••••••••';
                button.textContent = 'Show';
            }
        }
    </script>
</body>
</html>
